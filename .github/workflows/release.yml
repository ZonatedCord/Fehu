name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: '--target aarch64-apple-darwin'
            label: aarch64
          - os: macos-14
            args: '--target x86_64-apple-darwin'
            label: x86_64
          - os: windows-latest
            args: ''
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract tesseract-lang

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fehu ${{ github.ref_name }}'
          releaseBody: |
            ## Fehu ${{ github.ref_name }}

            ### Requirements
            - **macOS:** `brew install tesseract tesseract-lang`
            - **Windows:** [Tesseract OCR installer](https://github.com/UB-Mannheim/tesseract/wiki)
            - **Ollama** (optional): install `qwen2.5-coder:7b` for LLM categorization

            ### macOS Gatekeeper
            If the app is blocked on first launch:
            ```
            xattr -dr com.apple.quarantine /Applications/Fehu.app
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  create-update-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minisign
        run: sudo apt-get install -y minisign

      - name: Download artifacts, sign, and generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p /tmp/artifacts /tmp/sigs

          gh release download "$TAG" --repo ZonatedCord/Fehu \
            --pattern "Fehu_aarch64.app.tar.gz" \
            --pattern "Fehu_x64.app.tar.gz" \
            --dir /tmp/artifacts/ 2>/dev/null || true

          WIN_EXE="Fehu_${VERSION}_x64-setup.exe"
          gh release download "$TAG" --repo ZonatedCord/Fehu \
            --pattern "$WIN_EXE" \
            --dir /tmp/artifacts/ 2>/dev/null || true

          echo "Downloaded artifacts:"
          ls /tmp/artifacts/

          # Write private key to file
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > /tmp/fehu.key
          chmod 600 /tmp/fehu.key

          # Sign each artifact
          for artifact in \
            /tmp/artifacts/Fehu_aarch64.app.tar.gz \
            /tmp/artifacts/Fehu_x64.app.tar.gz \
            /tmp/artifacts/"$WIN_EXE"; do
            [ -f "$artifact" ] || continue
            base=$(basename "$artifact")
            printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" | \
              minisign -S -s /tmp/fehu.key \
                -m "$artifact" \
                -x "/tmp/sigs/${base}.sig" \
              && echo "Signed: $base"
          done

          echo "Signatures:"
          ls /tmp/sigs/

          python3 .github/scripts/gen_latest_json.py /tmp/sigs
          cat /tmp/latest.json
          gh release upload "$TAG" /tmp/latest.json --repo ZonatedCord/Fehu --clobber
